name: 補跑歷史盤後報告
on:
  workflow_dispatch:
    inputs:
      start:
        description: "起始日 YYYY-MM-DD（Yahoo 1 分鐘資料約保留 30 天）"
        required: true
      end:
        description: "結束日 YYYY-MM-DD"
        required: true
      refetch_daily:
        description: "先重抓日線並與既有檔合併（修復被不完整下載覆寫的歷史；填期間如 3mo，留空不做）"
        default: ""
      upload_bars:
        description: "把補到的 1 分 K 上傳為 Release（供同時點分母累積歷史）"
        type: boolean
        default: true
      publish_baseline:
        description: "補完後發布同時點基準（量能三指標的分母；不勾則它們在下次盤後批次前都不會計算）"
        type: boolean
        default: false
      rebuild_profile:
        description: "重建分鐘量基準（危險：會先清空 profile.csv，只在它壞掉時才勾）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hk-data            # 與盤中／盤後共用：會寫 data/，不可同時執行
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # 一天約 5~6 分鐘（與盤中批次的下載量相同）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      # 先修日線再補跑：backfill.py 只讀磁碟上既有的日線，不會自己重抓。
      # 日線若被不完整的下載覆寫過（2026-10-21、2026-10-28 各發生過一次），
      # 不先補齊就補跑，等於拿殘缺的分母重算一遍。
      - if: inputs.refetch_daily != ''
        name: 重抓日線並與既有檔合併
        run: python src/eod.py --refetch-daily ${{ inputs.refetch_daily }}

      - env:
          GITHUB_TOKEN: ${{ github.token }}   # bars_store 需要它才讀得到 Release 上既有的 1 分 K
        run: |
          python src/backfill.py ${{ inputs.start }} ${{ inputs.end }} \
            ${{ inputs.rebuild_profile && '--rebuild-profile' || '' }}

      # 只上傳 1 分 K，不上傳同時點基準（baseline）。
      # 基準一旦上到 Release，下一次盤中批次就會改用新分母；留給當天的盤後批次統一重算後上傳，
      # 才不會在盤中無預警切換公式。
      - if: inputs.upload_bars
        name: 上傳補到的 1 分 K 至 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          n=0
          for f in data/bars/bars_*.parquet; do
            [ -e "$f" ] || continue
            day=$(basename "$f" .parquet); day=${day#bars_}
            tag="bars-$day"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$f" --clobber
            else
              gh release create "$tag" "$f" --title "1 分 K $day" \
                --notes "補跑產生，保留 30 天" --prerelease
            fi
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -q "$(basename "$f")"
            echo "::notice::已上傳 $tag ($(du -h "$f" | cut -f1))"
            n=$((n+1))
          done
          echo "::notice::共上傳 $n 天的 1 分 K"

      # 發布基準＝讓量能三指標在下一次盤中批次就改用同時點分母。
      # 預設不做，讓你先看過補跑出來的報告再決定；平常這一步由每日盤後批次自動完成。
      - if: inputs.publish_baseline
        name: 建立並發布同時點基準
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          f=$(python src/publish_baseline.py | tail -1)
          day=${f#baseline_}; day=${day%.parquet}
          gh release upload "bars-$day" "data/baseline/$f" --clobber
          gh release view "bars-$day" --json assets --jq '.assets[].name' | grep -q "$f"
          echo "::notice::已發布 $f 至 bars-$day（下次盤中批次起，量能三指標改用同時點分母）"

      - name: 存回 repo
        run: bash .github/commit.sh "backfill ${{ inputs.start }}~${{ inputs.end }}"
