name: 每週更新股本（換手率用）
on:
  schedule:
    - cron: "0 2 * * 6"          # 每週六 10:00（香港/台北）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300        # info() 比 fast_info 慢很多，全港股約 1–2 小時
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python src/update_shares.py
      - name: 存回 repo
        run: bash .github/commit.sh "shares"
