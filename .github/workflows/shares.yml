name: 每週更新股本（換手率用）
on:
  schedule:
    - cron: "0 2 * * 6"          # 每週六 10:00（香港/台北）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # 刻意不與 hk-data 同群組：本工作要跑 1–2 小時，若與盤中／盤後批次共用群組，
  # 手動在交易時段觸發會把當天所有盤中批次排隊卡住。
  # 本工作只寫 config/shares.csv，與 data/ 無重疊，commit.sh 的 pull --rebase 重試足以處理同時推送。
  group: hk-shares
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300        # info() 比 fast_info 慢很多，全港股約 1–2 小時
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python src/update_shares.py
      - name: 存回 repo
        run: bash .github/commit.sh "shares"
