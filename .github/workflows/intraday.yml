name: 盤中監控
on:
  schedule:
    # cron 為 UTC 時間（香港/台北 = UTC+8）。每 30 分鐘、午休不跑、避開整點。
    - cron: "2,32 2-3 * * 1-5"   # 10:02 10:32 11:02 11:32
    - cron: "17 4 * * 1-5"       # 12:17（取得早市收市前資料）
    - cron: "32 5 * * 1-5"       # 13:32
    - cron: "2,32 6-7 * * 1-5"   # 14:02 14:32 15:02 15:32
    - cron: "2 8 * * 1-5"        # 16:02
  workflow_dispatch:
    inputs:
      force:
        description: "非交易時段也執行（測試用，改用最近一個交易日行情）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read             # 讀取執行紀錄，判斷同一時段是否已跑過

concurrency:
  group: hk-data            # 與盤後批次共用，避免同時寫入
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 這個時段已跑過就略過（只限 GitHub 定時排程）
        id: gate
        # Cloudflare 會在排定時間準時觸發；GitHub 排程常晚到，晚到時若同一時段已有成功的盤中監控就不再重跑，節省私有 repo 的 Actions 分鐘數。
        # 手動執行與 Cloudflare 觸發（workflow_dispatch）不受影響。
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOTS: "10:02 10:32 11:02 11:32 12:17 13:32 14:02 14:32 15:02 15:32 16:02"   # 香港／台北時間，需與上方 cron 一致
        run: |
          now=$(TZ=Asia/Hong_Kong date +%H:%M)
          today=$(TZ=Asia/Hong_Kong date +%F)
          slot=""
          for s in $SLOTS; do [[ "$s" > "$now" ]] || slot=$s; done
          if [ -z "$slot" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "TZ=\"Asia/Hong_Kong\" $today $slot" +%Y-%m-%dT%H:%M:%SZ)
          done_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/intraday.yml/runs?created=>=$since&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion == \"success\")] | length") || done_runs=0
          if [ "${done_runs:-0}" -gt 0 ]; then
            echo "::notice::盤中監控 $slot 時段已有成功執行，本次排程略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "盤中監控 $slot 時段尚未執行，照常執行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements-pipeline.txt
      - if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # bars_store 需要它才讀得到 Release 上的基準
        run: python src/intraday.py ${{ inputs.force && '--force' || '' }}
      - if: steps.gate.outputs.skip != 'true'
        name: 存回 repo
        run: bash .github/commit.sh "intraday"
