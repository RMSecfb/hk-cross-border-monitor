name: 重建同時點基準
# 由 Release 上現有的 1 分 K 重算基準並上傳。不抓 Yahoo，只下載既有附件，約 2~3 分鐘。
# 平常由每日盤後批次自動完成；補跑完歷史、或基準算錯時用這支手動補發一次。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hk-baseline        # 不寫 data/，不必與盤中／盤後排隊
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: 重算並上傳基準
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          f=$(python src/publish_baseline.py | tail -1)
          day=${f#baseline_}; day=${day%.parquet}
          gh release upload "bars-$day" "data/baseline/$f" --clobber
          gh release view "bars-$day" --json assets --jq '.assets[].name' | grep -q "$f"
          echo "::notice::已發布 $f 至 bars-$day"
