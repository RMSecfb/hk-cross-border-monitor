name: 盤後批次
on:
  schedule:
    - cron: "42 8 * * 1-5"       # 香港/台北 16:42
  workflow_dispatch:
    inputs:
      init:
        description: "初始化：下載約半年日線並建立基準檔（第一次使用時勾選）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python src/eod.py ${{ inputs.init && '--init' || '' }}
      - name: 存回 repo
        run: bash .github/commit.sh "eod"
