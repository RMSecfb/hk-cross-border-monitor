name: 盤後批次
on:
  schedule:
    - cron: "42 8 * * 1-5"       # 香港/台北 16:42
  workflow_dispatch:
    inputs:
      init:
        description: "初始化：下載約半年日線並建立基準檔（第一次使用時勾選）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read             # 讀取執行紀錄，判斷同一時段是否已跑過

concurrency:
  group: hk-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 這個時段已跑過就略過（只限 GitHub 定時排程）
        id: gate
        # Cloudflare 會在排定時間準時觸發；GitHub 排程常晚到，晚到時若同一時段已有成功的盤後批次就不再重跑，節省私有 repo 的 Actions 分鐘數。
        # 手動執行與 Cloudflare 觸發（workflow_dispatch）不受影響。
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOTS: "16:42"   # 香港／台北時間，需與上方 cron 一致
        run: |
          now=$(TZ=Asia/Hong_Kong date +%H:%M)
          today=$(TZ=Asia/Hong_Kong date +%F)
          slot=""
          for s in $SLOTS; do [[ "$s" > "$now" ]] || slot=$s; done
          if [ -z "$slot" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "TZ=\"Asia/Hong_Kong\" $today $slot" +%Y-%m-%dT%H:%M:%SZ)
          done_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/eod.yml/runs?created=>=$since&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion == \"success\")] | length") || done_runs=0
          if [ "${done_runs:-0}" -gt 0 ]; then
            echo "::notice::盤後批次 $slot 時段已有成功執行，本次排程略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "盤後批次 $slot 時段尚未執行，照常執行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements-pipeline.txt
      - if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # bars_store 需要它才讀得到 Release 上的 1 分 K
        run: python src/eod.py ${{ inputs.init && '--init' || '' }}

      # 1 分 K 歷史存為 Release 附件：不佔 git 容量、不計費，刪除後空間即回收。
      # 供「過去 N 日同時點」基準使用（3分鐘量暴增/連續放量需 5 日、成交量暴增需 20 日）。
      - if: steps.gate.outputs.skip != 'true'
        name: 上傳 1 分 K 至 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          f=$(ls -1 data/bars/bars_*.parquet 2>/dev/null | sort | tail -1) || true
          if [ -z "$f" ]; then echo "::notice::本次沒有 1 分 K 檔案，略過"; exit 0; fi
          day=$(basename "$f" .parquet); day=${day#bars_}
          tag="bars-$day"
          # 同時點基準檔（盤中只抓這個小檔，不必下載 20 天的原始 1 分 K）
          bl="data/baseline/baseline_$day.parquet"
          [ -f "$bl" ] || bl=""
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$f" $bl --clobber
          else
            gh release create "$tag" "$f" $bl --title "1 分 K $day" --notes "自動產生，保留 30 天" --prerelease
          fi
          # 確認附件確實存在，避免靜默失敗
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -q "$(basename "$f")"
          echo "::notice::已上傳 $tag / $(basename "$f") ($(du -h "$f" | cut -f1))"
          [ -n "$bl" ] && echo "::notice::已上傳 $(basename "$bl") ($(du -h "$bl" | cut -f1))"
          # 刪除超過 30 天的，連同 tag 一併清除
          cut=$(date -u -d "30 days ago" +%Y%m%d)
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^bars-' || true); do
            if [ "${t#bars-}" -lt "$cut" ]; then
              gh release delete "$t" --yes --cleanup-tag && echo "已刪除 $t"
            fi
          done

      - if: steps.gate.outputs.skip != 'true'
        name: 存回 repo
        run: bash .github/commit.sh "eod"
