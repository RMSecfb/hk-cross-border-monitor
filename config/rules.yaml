# ===== 異常交易監控參數（取自 Excel「異常交易監控參數」「VCM與市場機制」）=====
# 數值為 黃 / 橙 / 紅 三級閾值；調整後請同步記錄於 Excel「參數調整日誌」

day_change:  {黃: 8,  橙: 12, 紅: 18}   # 即時漲跌幅 %（現價 vs 前收）
chg_1m:      {黃: 3,  橙: 5,  紅: 8}    # 1 分鐘急漲急跌 %
chg_5m:      {黃: 6,  橙: 10, 紅: 15}   # 5 分鐘急漲急跌 %
ma_dev:      {黃: 10, 橙: 15, 紅: 25}   # 偏離 20 日均線 %
open_gap:    {黃: 5,  橙: 8,  紅: 12}   # 開盤價 vs 前收 %
# ----- 收市競價異常（盤後）：三閥門，見 docs/監控指標調整規劃.md 六 -----
# CAS 委託價受限於參考價 ±5%，原紅燈 8% 在結構上永遠觸發不到，故此指標是「門檻維持現行」的唯一例外。
cas_dev_main: {黃: 1.0, 橙: 1.5, 紅: 2.5}          # 一般股：只看偏離度，不設金額下限
cas_dev_thin: {黃: 3.0, 橙: 4.0, 紅: 4.0,          # 冷門股：橙／紅另需金額或占比條件
               橙_金額: 10000, 紅_金額: 50000, 紅_占比: 30}
cas_pool_split_turnover: 10000000   # 一般股／冷門股分流：20 日平均成交額（與量能指標分池同值）
cas_max_stale_min: 30       # 持續交易最後一筆距 16:00 超過此分鐘數 → 低頻自然跳空，降一級（黃→不通報）
cas_max_dev: 5              # 偏離超過此值（CAS 的結構上限）視為資料異常，不給等級
# ----- 量能類雙軌：A = 熱門股（20 日均成交額 ≥ pool_split_turnover）、B = 冬眠股 -----
# 兩軌倍數門檻相同，差別只在 min_turnover（當下累計成交額的絕對下限）。
# 冬眠股平時幾乎無成交，倍數會被極小的分母放大，故要求更高的實際成交金額才列入判定。
pool_split_turnover: 10000000           # A／B 軌分池：20 日平均成交額
vol_ratio:                              # 累計成交量 vs 同時點正常累計量（倍）
  A: {黃: 3, 橙: 5, 紅: 10, min_turnover: 1000000}
  B: {黃: 3, 橙: 5, 紅: 10, min_turnover: 5000000}
vol_3m:                                 # 3 分鐘成交量 vs 歷史同時段均量（倍；需累積 min_profile_days 天）
  A: {黃: 3, 橙: 5, 紅: 8,  min_turnover: 1000000}
  B: {黃: 3, 橙: 5, 紅: 8,  min_turnover: 5000000}
vol_streak:  {黃: 2,  橙: 3,  紅: 5}    # 連續放量：單軌，僅活躍股；連續 N 分鐘每分鐘量都 ≥ 基準量的幾倍
vol_streak_minutes: 15
min_profile_days: 5         # 已停用：舊的 30 分鐘時段內插分母已移除，量能指標一律用同時點基準
min_hist_days: 5            # 同時點分母：3 分鐘量暴增／連續放量至少需該檔幾個交易日的 1 分 K
min_hist_days_cum: 10       # 同時點分母：成交量暴增至少需幾個交易日（規劃為 20 日平均，不足時先用現有天數）
turnover:    {黃: 15, 橙: 25, 紅: 40}   # 換手率 %（需 shares.csv）

max_prev_gap_min: 3         # 1 分鐘急漲急跌：上一根 K 線距今超過此分鐘數即不計算（避免把長時間跳空當成瞬間急漲）
max_ref_gap_5m_min: 8       # 5 分鐘急漲急跌：參考價距今超過此分鐘數即不計算
                            # （＝規則本身的 5 分鐘 ＋ 與上一行相同的 3 分鐘緩衝；兩者可分開調整）
open_window_min: 5          # 開盤價異常：第一根 K 線須落在 09:30 後此分鐘數內，否則不視為開盤價

ma_days: 20                 # 偏離均線用 MA 天數（5 / 10 / 20）
vol_avg_days: 20            # 均量天數
min_turnover_hkd: 1000000   # 當日成交額低於此值的冷門股，不做短時急漲急跌/量暴增（減少誤報）
active_min_avg_turnover_hkd: 10000000   # 「活躍股」= 20 日平均成交額 ≥ 此值；3 分鐘量暴增、連續放量、偏離均線只監控活躍股（同 Excel 適用範圍）
vcm_ratio:   {黃: 0.8, 橙: 0.9, 紅: 1.0}   # VCM 預警：|5 分鐘偏離| ÷ 該股 VCM 門檻（紅 = 已達交易所熔斷門檻）

# ===== 趨勢追蹤（盤後）=====
# 每日風險分數 = 各規則當日最高等級的分數加總（上限 100）
score_weights: {紅: 40, 橙: 25, 黃: 10}
list_min_score: 30          # 分數 ≥ 此值視為「上榜」（進入盤後預警列表）
streak_min_score: 60        # 連續異常標的門檻：需連續 streak_days 日分數皆 ≥ 此值（≥ 紅+橙 或兩個紅）
streak_days: 3              # 連續異常標的：最近 N 個交易日皆 ≥ streak_min_score

# 冷卻時間（分鐘）：同一股票、同一規則、同一等級在冷卻期內只報一次
cooldown_min:
  即時漲跌幅: 5
  1分鐘急漲急跌: 3
  5分鐘急漲急跌: 5
  偏離均線: 15
  開盤價異常: 10
  收市競價異常: 5
  成交量暴增: 10
  3分鐘量暴增: 5
  連續放量: 10
  換手率異常: 30         # 僅盤後計算，冷卻實際上不會作用
  VCM預警: 5
