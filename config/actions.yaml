# ===== 盤後預警列表「操作建議」=====
# 依規則類別 × 等級給建議，參考 Excel「即時監控儀表板」示範列表與「預警通知設計」通知矩陣。可自行修改。

價格:
  rules: [即時漲跌幅, 1分鐘急漲急跌, 5分鐘急漲急跌, 開盤價異常, 收市競價異常]
  黃: 記錄觀察；確認有無公告或新聞
  橙: 關注是否消息驅動；檢視本公司客戶成交占比
  紅: 查詢主力動向；通知合規

偏離均線:
  rules: [偏離均線]
  黃: 記錄觀察
  橙: 檢視近期公告與客戶持倉集中度
  紅: 列入重點觀察名單；通知風控主管

成交量:
  rules: [成交量暴增, 3分鐘量暴增, 連續放量, 換手率異常]
  黃: 記錄觀察
  橙: 關注是否消息驅動；檢視大額成交
  紅: 檢查本公司客戶是否集中成交；通知合規

VCM:
  rules: [VCM觸發(模擬), VCM內部預警]
  黃: 提醒交易室留意；檢視客戶大額委託
  橙: 提醒交易室留意；檢視客戶大額委託
  紅: 通知交易室與風控；冷靜期內拒絕會擴大偏離的委託
